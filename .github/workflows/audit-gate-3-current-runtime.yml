name: Audit GATE 3 Current Runtime

on:
  pull_request:
    branches:
      - gate-3.0/phase-4-unified-operational-platform
    types: [opened, synchronize, reopened]
  push:
    branches:
      - gate-3.0/phase-5-certification
    paths:
      - scripts/audit-gate-3-current-runtime.mjs
      - .github/workflows/audit-gate-3-current-runtime.yml

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message || '', '[gate-3-current-index]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out transition branch
        uses: actions/checkout@v4
        with:
          ref: gate-3.0/phase-5-certification
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate repository audit and runtime index
        id: audit
        continue-on-error: true
        run: |
          set +e
          node scripts/audit-gate-3-current-runtime.mjs > gate-3-current-audit.log 2>&1
          code=$?
          cat gate-3-current-audit.log
          exit $code

      - name: Upload audit diagnostic
        if: steps.audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-3-current-audit-diagnostic
          path: gate-3-current-audit.log
          retention-days: 7

      - name: Stop after failed audit
        if: steps.audit.outcome == 'failure'
        run: exit 1

      - name: Commit authoritative index and remove audit tooling
        if: steps.audit.outcome == 'success'
        run: |
          rm -f scripts/audit-gate-3-current-runtime.mjs .github/workflows/audit-gate-3-current-runtime.yml gate-3-current-audit.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Re-index actual GATE 3 repository state [gate-3-current-index]'
          git push origin HEAD:gate-3.0/phase-5-certification

