name: GATE 3 Status Board Shadow Retirement

on:
  push:
    paths:
      - 'public/index.html'
      - 'public/app/status-board-shadow/**'
      - 'public/js/gate-status-board-shadow-controller.js'
      - 'functions/_middleware.js'
      - 'tests/build-2/status-board-shadow/**'
      - 'tests/runtime/**'
      - '.github/workflows/build-2-phase-3a-status-board-shadow.yml'
  pull_request:
    paths:
      - 'public/index.html'
      - 'public/app/status-board-shadow/**'
      - 'public/js/gate-status-board-shadow-controller.js'
      - 'functions/_middleware.js'
      - 'tests/build-2/status-board-shadow/**'
      - 'tests/runtime/**'
      - '.github/workflows/build-2-phase-3a-status-board-shadow.yml'

permissions:
  contents: read

concurrency:
  group: gate-3-status-board-retirement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status-board-retirement:
    name: Static ownership and shadow retirement
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate migrated source syntax
        run: |
          node --check public/js/gate-data-sdk.js
          node --check public/js/gate-application-bootstrap.js
          node --check public/js/gate-status-board-controller.js
          node --experimental-default-type=module --check functions/_middleware.js

      - name: Validate runtime and record integrity
        run: |
          node --test tests/runtime/*.test.mjs

      - name: Validate complete foundation data plane
        run: |
          node --test tests/build-2/foundation/*.test.mjs
          node --experimental-default-type=module --test tests/build-2/server/*.test.mjs
          node --test tests/build-2/data/*.test.mjs
          node --test tests/build-2/domain/*.test.mjs
          node --test tests/build-2/parity/*.test.mjs

      - name: Validate workflows and degraded operation
        run: |
          node --test tests/build-2/workflows/*.test.mjs
          node --test tests/build-2/synchronization/*.test.mjs

      - name: Validate complete application foundation
        run: |
          node --test tests/build-2/design/*.test.mjs
          node --test tests/build-2/components/*.test.mjs
          node --test tests/build-2/shell/*.test.mjs
          node --test tests/build-2/responsive/*.test.mjs
          node --test tests/build-2/accessibility/*.test.mjs

      - name: Validate static application ownership
        run: |
          grep -q '/css/gate-application-structure.css' public/index.html
          grep -q '/js/gate-data-sdk.js' public/index.html
          grep -q '/js/gate-application-bootstrap.js' public/index.html
          ! grep -Eq '<style([[:space:]>])' public/index.html
          ! grep -Eq 'UI_STYLESHEETS|UI_HEAD_SCRIPTS|injectUiAssets|applyStatusBoardMetricSourceRefactor|normalizeServedBranding|stripLegacyInlineShellCss' functions/_middleware.js

      - name: Validate Status Board shadow retirement
        run: |
          ! grep -q 'gate-status-board-shadow-controller.js' public/index.html
          ! grep -q 'gate-status-board-shadow-controller.js' functions/_middleware.js
          ! grep -q 'status-board-shadow/index.mjs' functions/_middleware.js
          node --input-type=module <<'NODE'
          import { ROUTES } from './public/app/shell/route-registry.mjs';
          if (ROUTES.length !== 6) throw new Error(`Expected six canonical routes, found ${ROUTES.length}.`);
          if (ROUTES.some(route => /shadow/i.test(route.id) || /shadow/i.test(route.label))) throw new Error('Retired shadow must not be a visible route.');
          if (!ROUTES.some(route => route.id === 'board')) throw new Error('Status Board route is missing.');
          NODE
