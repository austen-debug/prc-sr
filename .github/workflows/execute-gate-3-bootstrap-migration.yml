name: Execute GATE 3 Bootstrap Migration

on:
  pull_request:
    branches:
      - gate-3.0/phase-4-unified-operational-platform
    types: [opened, synchronize, reopened]
  push:
    branches:
      - gate-3.0/phase-5-certification
    paths:
      - scripts/execute-gate-3-bootstrap-migration.mjs
      - .github/workflows/execute-gate-3-bootstrap-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[gate-3-bootstrap-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out transition branch
        uses: actions/checkout@v4
        with:
          ref: gate-3.0/phase-5-certification
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correct migration self-check
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/execute-gate-3-bootstrap-migration.mjs')
          text = path.read_text()
          text = text.replace(
              "  assert(!MINIMAL_MIDDLEWARE.includes('replace('), 'Minimal middleware unexpectedly contains UI rewriting.');",
              "  assert(!/applyAppShellIdentity|normalizeServedBranding|stripLegacyInlineShellCss|applyStatusBoardMetricSourceRefactor|injectUiAssets/.test(MINIMAL_MIDDLEWARE), 'Minimal middleware unexpectedly contains UI rewriting.');"
          )
          path.write_text(text)
          PY

      - name: Execute bootstrap and middleware migration
        id: migration
        continue-on-error: true
        run: |
          set +e
          node scripts/execute-gate-3-bootstrap-migration.mjs > gate-3-bootstrap-migration.log 2>&1
          code=$?
          cat gate-3-bootstrap-migration.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload migration diagnostic
        if: steps.migration.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-3-bootstrap-migration-diagnostic
          path: gate-3-bootstrap-migration.log
          if-no-files-found: error
          retention-days: 7

      - name: Stop after failed migration
        if: steps.migration.outcome == 'failure'
        run: exit 1

      - name: Verify extraction boundary
        if: steps.migration.outcome == 'success'
        run: |
          test -f public/css/gate-application-structure.css
          test -f public/js/gate-data-sdk.js
          test -f public/js/gate-application-bootstrap.js
          ! grep -E '<style([[:space:]>])' public/index.html
          ! grep -E 'applyAppShellIdentity|normalizeServedBranding|stripLegacyInlineShellCss|applyStatusBoardMetricSourceRefactor|injectUiAssets' functions/_middleware.js
          grep -q '/css/gate-application-structure.css' public/index.html
          grep -q '/js/gate-data-sdk.js' public/index.html
          grep -q '/js/gate-application-bootstrap.js' public/index.html

      - name: Commit transformed application
        if: steps.migration.outcome == 'success'
        run: |
          if git diff --quiet; then
            echo 'Migration produced no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/execute-gate-3-bootstrap-migration.mjs public/index.html public/css/gate-application-structure.css public/js/gate-data-sdk.js public/js/gate-application-bootstrap*.js functions/_middleware.js
          git commit -m 'Extract GATE 3 bootstrap and retire middleware UI rewriting [gate-3-bootstrap-migrated]'
          git push origin HEAD:gate-3.0/phase-5-certification
