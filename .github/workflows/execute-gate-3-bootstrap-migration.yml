name: Execute GATE 3 Bootstrap Migration

on:
  pull_request:
    branches:
      - gate-3.0/phase-4-unified-operational-platform
    types: [opened, synchronize, reopened]
  push:
    branches:
      - gate-3.0/phase-5-certification
    paths:
      - scripts/execute-gate-3-bootstrap-migration.mjs
      - scripts/extract-inline-event-bindings.mjs
      - .github/workflows/execute-gate-3-bootstrap-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[gate-3-static-bootstrap-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out transition branch
        uses: actions/checkout@v4
        with:
          ref: gate-3.0/phase-5-certification
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract bootstrap when inline assets remain
        run: |
          if grep -Eq '<style([[:space:]>])' public/index.html || grep -Eq '<script([^>]*)>[[:space:]]*[^<]' public/index.html; then
            node scripts/execute-gate-3-bootstrap-migration.mjs
          else
            echo 'Inline style/script extraction already complete.'
          fi

      - name: Extract inline event bindings
        run: node scripts/extract-inline-event-bindings.mjs

      - name: Verify static application boundary
        run: |
          test -f public/css/gate-application-structure.css
          test -f public/js/gate-data-sdk.js
          test -f public/js/gate-application-bootstrap.js
          ! grep -Eq '<style([[:space:]>])' public/index.html
          ! grep -Eq '[[:space:]]on(click|change|submit|keydown|keyup|input|blur|focus|contextmenu)=' public/index.html
          ! grep -Eq 'applyAppShellIdentity|normalizeServedBranding|stripLegacyInlineShellCss|applyStatusBoardMetricSourceRefactor|injectUiAssets|UI_STYLESHEETS|UI_HEAD_SCRIPTS' functions/_middleware.js
          grep -q '/css/gate-application-structure.css' public/index.html
          grep -q '/js/gate-data-sdk.js' public/index.html
          grep -q '/js/gate-application-bootstrap.js' public/index.html
          grep -q 'installGateDeclarativeEventBoundary' public/js/gate-application-bootstrap.js

      - name: Commit transformed application
        run: |
          if git diff --quiet; then
            echo 'Static bootstrap boundary already complete.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/execute-gate-3-bootstrap-migration.mjs scripts/extract-inline-event-bindings.mjs public/index.html public/css/gate-application-structure.css public/js/gate-data-sdk.js public/js/gate-application-bootstrap*.js functions/_middleware.js
          git commit -m 'Complete static GATE 3 bootstrap and event extraction [gate-3-static-bootstrap-complete]'
          git push origin HEAD:gate-3.0/phase-5-certification
