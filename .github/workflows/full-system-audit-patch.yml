name: One-time full system audit repair

on:
  push:
    branches:
      - audit/full-system-integrity-20260914
    paths:
      - .github/workflows/full-system-audit-patch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-system-integrity-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited presentation and CI repairs
        run: python3 tools/full_system_audit_patch.py
      - name: Wire full-system test into integrity gates
        run: python3 -c "from pathlib import Path; p=Path('.github/workflows/runtime-record-integrity-tests.yml'); t=p.read_text(); m='      - name: Record display integrity\\n        run: node --test tests/runtime/record-display-integrity.test.mjs\\n'; t=t if 'Full system integrity' in t else t.replace(m,m+'\\n      - name: Full system integrity\\n        run: node --test tests/runtime/full-system-integrity.test.mjs\\n',1); p.write_text(t); p=Path('.github/workflows/build-2-audit-remediation-gate-1.yml'); t=p.read_text(); m='          node --test tests/runtime/active-runtime-budget.test.mjs\\n'; t=t if 'tests/runtime/full-system-integrity.test.mjs' in t else t.replace(m,m+'          node --test tests/runtime/full-system-integrity.test.mjs\\n',1); p.write_text(t)"
      - name: Validate full-system repairs
        run: |
          node --test tests/runtime/full-system-integrity.test.mjs
          node --test tests/runtime/active-runtime-budget.test.mjs
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/processing-modal-record-persistence.test.mjs
          node --test tests/runtime/status-board-visual-stability.test.mjs
          if grep -R '!important' -n public/css/military-glass-terminal.css; then exit 1; fi
      - name: Commit audited repairs
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/css/military-glass-terminal.css tests/runtime/full-system-integrity.test.mjs .github/workflows/runtime-record-integrity-tests.yml .github/workflows/build-2-audit-remediation-gate-1.yml
          git commit -m "Restore responsive contracts and add full-system integrity audit"
          git push origin HEAD:audit/full-system-integrity-20260914
