name: One-time full system audit repair

on:
  push:
    branches:
      - audit/full-system-integrity-20260914
    paths:
      - .github/workflows/full-system-audit-patch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-system-integrity-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align mobile shell presentation with application breakpoint
        run: python3 tools/mobile_shell_alignment_patch.py
      - name: Validate full-system repairs
        run: |
          node --test tests/runtime/full-system-integrity.test.mjs
          node --test tests/runtime/active-runtime-budget.test.mjs
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/processing-modal-record-persistence.test.mjs
          node --test tests/runtime/status-board-visual-stability.test.mjs
          if grep -RE '!important\s*;' public/css/military-glass-terminal.css; then exit 1; fi
      - name: Commit audited mobile alignment
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/css/military-glass-terminal.css
          git commit -m "Align mobile shell breakpoint and interaction state"
          git push origin HEAD:audit/full-system-integrity-20260914
