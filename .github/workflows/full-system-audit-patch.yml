name: One-time full system audit repair

on:
  push:
    branches:
      - audit/full-system-integrity-20260914
    paths:
      - .github/workflows/full-system-audit-patch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-system-integrity-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore audited responsive and shell contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('public/css/military-glass-terminal.css')
          css = css_path.read_text()

          body_before = re.compile(r"body::before\s*\{[\s\S]*?\}\n\nbody\.theme-light::before\s*\{[\s\S]*?\}\n", re.M)
          replacement = r'''body::before {
  content: none;
  display: none;
}

body.gate-app-shell-ready.gate-watermark-page::after {
  content: "";
  position: fixed;
  left: 50vw;
  top: 52vh;
  z-index: var(--mg-z-base);
  width: min(64vw, 980px);
  height: min(64vw, 980px);
  pointer-events: none;
  background: url('/assets/gate_emblem_white.png') center / contain no-repeat;
  opacity: .06;
  filter: grayscale(1);
  transform: translate3d(-50%, -50%, 0);
}

body.theme-light.gate-app-shell-ready.gate-watermark-page::after {
  background-image: url('/assets/gate_emblem_blue.png');
  opacity: .035;
  filter: grayscale(.35) saturate(.55);
}

body.gate-app-shell-ready.gate-watermark-processing::after {
  width: min(56vw, 820px);
  height: min(56vw, 820px);
  opacity: .045;
}

body.theme-light.gate-app-shell-ready.gate-watermark-processing::after {
  opacity: .025;
}
'''
          css, count = body_before.subn(replacement, css, count=1)
          if count != 1:
              raise SystemExit('Could not replace global grid background contract')

          generic = '''#role-toggle,\n#fullscreen-btn,\n#sound-toggle-btn,\n#theme-toggle-btn,\n#week-group-display,\n#mobile-menu-trigger {'''
          fixed = '''#role-toggle,\n#fullscreen-btn,\n#sound-toggle-btn,\n#theme-toggle-btn,\n#week-group-display {'''
          if generic not in css:
              raise SystemExit('Mobile trigger generic selector contract not found')
          css = css.replace(generic, fixed, 1)

          old_hide = '''#mobile-menu-trigger,\n.gate-shell-system-panel,\n.gate-shell-system-controls,\n#gate-mobile-menu-scrim {\n  display: none;\n}'''
          new_hide = '''#mobile-menu-trigger,\n#gate-mobile-nav-sheet,\n#gate-mobile-menu-scrim,\n.gate-shell-system-panel,\n.gate-shell-system-controls {\n  display: none;\n  visibility: hidden;\n  pointer-events: none;\n}'''
          if old_hide not in css:
              raise SystemExit('Default mobile artifact hide contract not found')
          css = css.replace(old_hide, new_hide, 1)

          start = css.index('@media (max-width: 767px) {')
          end = css.index('@media (max-height: 560px)', start)
          phone = css[start:end]

          legacy_menu = re.compile(r'''  body\.gate-app-shell-ready #main-nav-menu,\n  body\.gate-app-shell-ready #nav-links,\n  body\.gate-app-shell-ready \.nav-group-left \{[\s\S]*?  body\.gate-app-shell-ready \.nav-group-left \.nav-btn \{[\s\S]*?  \}\n''')
          canonical_menu = r'''  body.gate-app-shell-ready #main-nav-menu,
  body.gate-app-shell-ready #nav-links,
  body.gate-app-shell-ready .nav-group-left {
    display: none;
    visibility: hidden;
    pointer-events: none;
  }

  body.gate-app-shell-ready #gate-mobile-nav-sheet {
    position: fixed;
    top: calc(var(--mg-shell-top) + .5rem);
    left: max(.75rem, env(safe-area-inset-left));
    right: max(.75rem, env(safe-area-inset-right));
    z-index: var(--mg-z-popover);
    display: none;
    grid-template-columns: minmax(0, 1fr);
    gap: .6rem;
    max-height: calc(100dvh - var(--mg-shell-top) - 1.5rem - env(safe-area-inset-bottom));
    padding: .7rem;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-gutter: stable;
    border: 1px solid var(--mg-border-strong);
    border-radius: var(--mg-radius-lg);
    background: var(--mg-surface-strong);
    box-shadow: var(--mg-shadow-strong);
    backdrop-filter: blur(18px) saturate(125%);
    -webkit-backdrop-filter: blur(18px) saturate(125%);
    visibility: hidden;
    pointer-events: none;
  }

  body.gate-app-shell-ready.gate-mobile-drawer-open #gate-mobile-nav-sheet,
  body.gate-app-shell-ready #gate-mobile-nav-sheet.gate-mobile-sheet-open {
    display: grid;
    visibility: visible;
    pointer-events: auto;
  }

  body.gate-app-shell-ready #gate-mobile-nav-sheet .gate-mobile-sheet-title,
  body.gate-app-shell-ready #gate-mobile-nav-sheet .gate-shell-system-label {
    color: var(--mg-text-muted);
    font-size: .66rem;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  body.gate-app-shell-ready #gate-mobile-nav-sheet .gate-mobile-sheet-routes,
  body.gate-app-shell-ready #gate-mobile-nav-sheet .gate-shell-system-controls,
  body.gate-app-shell-ready #gate-mobile-nav-sheet .gate-mobile-sheet-system {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: .5rem;
    width: 100%;
    min-width: 0;
  }

  body.gate-app-shell-ready #gate-mobile-nav-sheet .gate-mobile-sheet-system {
    margin-top: .2rem;
    padding-top: .65rem;
    border-top: 1px solid var(--mg-border-soft);
  }

  body.gate-app-shell-ready #gate-mobile-nav-sheet .nav-btn,
  body.gate-app-shell-ready #gate-mobile-nav-sheet .gate-component-nav-button,
  body.gate-app-shell-ready #gate-mobile-nav-sheet button {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    min-width: 0;
    min-height: 48px;
    padding: 0 .9rem;
    text-align: left;
  }
'''
          phone, count = legacy_menu.subn(canonical_menu, phone, count=1)
          if count != 1:
              raise SystemExit('Could not replace phone legacy nav overlay')

          phone = phone.replace('''  body::before {\n    inset: var(--mg-shell-top) 0 0;\n    background-size: 28px 28px, 28px 28px, min(82vw, 520px) auto;\n    opacity: .09;\n  }\n\n''', '''  body.gate-app-shell-ready.gate-watermark-page::after {\n    top: 58vh;\n    width: min(86vw, 520px);\n    height: min(86vw, 520px);\n    opacity: .018;\n  }\n\n  body.theme-light.gate-app-shell-ready.gate-watermark-page::after {\n    opacity: .014;\n  }\n\n''')

          airport_contract = r'''
  #page-airport.active {
    overflow-x: hidden;
    overflow-y: auto;
  }

  #page-airport .max-w-3xl,
  #page-airport #airport-form,
  #page-airport #airport-form > * {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
  }

  #page-airport #airport-form {
    display: block;
    overflow: visible;
    padding: 1rem;
  }

  #page-airport #airport-form > * {
    display: block;
    margin-bottom: .85rem;
  }

  #page-airport #airport-form input,
  #page-airport #airport-form button[type="submit"] {
    display: block;
    width: 100%;
    max-width: 100%;
    min-height: 48px;
    font-size: 16px;
  }

  #page-airport .surface:has(#airport-bus-log-body) {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }

  #page-airport .surface:has(#airport-bus-log-body) table {
    width: max-content;
    min-width: 760px;
  }
'''
          insert_before = '  .sat-arrivals-board {'
          if insert_before not in phone:
              raise SystemExit('Phone SAT block insertion point not found')
          phone = phone.replace(insert_before, airport_contract + '\n' + insert_before, 1)

          processing_back = r'''
  #dorm-modal.confirm-overlay:not(.hidden) .modal-content > .flex.justify-between.items-center.mb-4 > button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: auto;
    min-width: 52px;
    min-height: 44px;
    padding: 0 .78rem;
    border: 1px solid var(--mg-border-glass);
    border-radius: var(--mg-radius-pill);
    background: var(--mg-surface-soft);
    color: transparent;
    font-size: 0;
  }

  #dorm-modal.confirm-overlay:not(.hidden) .modal-content > .flex.justify-between.items-center.mb-4 > button::before {
    content: "BACK";
    color: var(--mg-text);
    font-size: .76rem;
    font-weight: 900;
    letter-spacing: .08em;
  }
'''
          modal_insert = '  #dorm-modal .gate-processing-workspace {'
          if modal_insert not in phone:
              raise SystemExit('Phone Processing modal insertion point not found')
          phone = phone.replace(modal_insert, processing_back + '\n' + modal_insert, 1)

          css = css[:start] + phone + css[end:]
          css_path.write_text(css)

          for wf_name in [
              '.github/workflows/runtime-record-integrity-tests.yml',
              '.github/workflows/build-2-audit-remediation-gate-1.yml'
          ]:
              path = Path(wf_name)
              text = path.read_text()
              text = re.sub(r"\n\s+- 'public/css/(?:gate-utilities-access|gate-premium-metrics|gate-ui-ownership-correction|gate-fullscreen-board-contract)\.css'", '', text)
              marker = "      - 'functions/_middleware.js'"
              if "public/css/military-glass-terminal.css" not in text:
                  text = text.replace(marker, marker + "\n      - 'public/css/military-glass-terminal.css'", 2)
              path.write_text(text)
          PY

      - name: Add full-system integrity test
        run: |
          cat > tests/runtime/full-system-integrity.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile, access } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import { dirname, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const here = dirname(fileURLToPath(import.meta.url));
          const root = resolve(here, '../..');
          const source = path => readFile(resolve(root, path), 'utf8');
          const exists = path => access(resolve(root, path));
          const pathOnly = value => String(value || '').split('?')[0];

          function arrayBlock(text, name) {
            const match = text.match(new RegExp(`const ${name} = \\[([\\s\\S]*?)\\n\\];`));
            assert.ok(match, `${name} must remain statically auditable`);
            return match[1];
          }

          function attrs(text, attribute) {
            return [...text.matchAll(new RegExp(`${attribute}="([^"]+)"`, 'g'))].map(match => match[1]);
          }

          test('all active middleware assets exist and every active JavaScript file parses', async () => {
            const middleware = await source('functions/_middleware.js');
            const styles = attrs(arrayBlock(middleware, 'UI_STYLESHEETS'), 'href').map(pathOnly);
            const scripts = attrs(arrayBlock(middleware, 'UI_HEAD_SCRIPTS'), 'src').map(pathOnly);
            assert.deepEqual(styles, ['/css/military-glass-terminal.css']);
            assert.equal(scripts.length, 27);
            for (const asset of [...styles, ...scripts]) await exists(`public${asset}`);
            for (const asset of scripts) {
              const result = spawnSync(process.execPath, ['--check', resolve(root, `public${asset}`)], { encoding: 'utf8' });
              assert.equal(result.status, 0, `${asset} failed parse check: ${result.stderr}`);
            }
          });

          test('all six operational routes and their critical DOM surfaces remain present', async () => {
            const html = await source('public/index.html');
            for (const id of ['page-board', 'page-airport', 'page-input', 'page-processing', 'page-archives']) {
              assert.match(html, new RegExp(`id=["']${id}["']`), `${id} missing from base DOM`);
            }
            for (const id of [
              'active-buses', 'col-empty', 'col-open', 'col-closed',
              'airport-form', 'airport-bus-log-body',
              'wg-batch-input', 'batch-grid-wrapper', 'batch-rows-container', 'init-wg-btn',
              'proc-dorm-grid', 'dorm-modal', 'dorm-edit-modal',
              'archive-history', 'local-bus-modal', 'airport-bus-edit-modal', 'confirm-dialog'
            ]) assert.match(html, new RegExp(`id=["']${id}["']`), `${id} missing from base DOM`);
            const squadron = await source('public/js/prc-dash-final-audit.js');
            assert.match(squadron, /page-squadron/);
            assert.match(squadron, /gate-squadron-page/);
          });

          test('canonical page and workflow owners remain exposed', async () => {
            const contracts = [
              ['public/js/gate-status-board-controller.js', /window\.GateStatusBoardController\s*=\s*Object\.freeze/],
              ['public/js/gate-processing-controller.js', /window\.GateProcessingController\s*=\s*Object\.freeze/],
              ['public/js/gate-bus-workflow-controller.js', /window\.GateBusWorkflowController\s*=\s*Object\.freeze/],
              ['public/js/gate-input-page-controller.js', /window\.GateInputPageController\s*=\s*Object\.freeze/],
              ['public/js/gate-archive-controller.js', /window\.GateArchiveController\s*=\s*Object\.freeze/],
              ['public/js/gate-app-shell-controller.js', /window\.GateAppShell/],
              ['public/js/gate-permission-guard.js', /window\.GatePermissionGuard/],
              ['public/js/gate-premium-metrics-controller.js', /window\.GatePremiumMetricsController/]
            ];
            for (const [path, pattern] of contracts) assert.match(await source(path), pattern, `${path} lost its canonical global`);
          });

          test('backend CRUD, session, SAT, and archive endpoints remain present without changing persistence', async () => {
            for (const path of [
              'functions/api/records.js', 'functions/api/records-contract.mjs',
              'functions/api/session.js', 'functions/api/session-contract.mjs',
              'functions/api/login.js', 'functions/api/logout.js', 'functions/api/ping.js',
              'functions/api/sat-arrivals.js', 'functions/api/archive-delete.js'
            ]) await exists(path);
            const records = await source('functions/api/records.js');
            for (const method of ['Get', 'Post', 'Put', 'Delete']) assert.match(records, new RegExp(`export async function onRequest${method}`));
            assert.match(records, /\.prepare\([\s\S]*?\.bind\(/);
          });

          test('authoritative records refresh contract remains live and mutation-confirmed', async () => {
            const html = await source('public/index.html');
            assert.match(html, /const API_URL = ['"]\/api\/records['"]/);
            assert.match(html, /await refresh\(true\);[\s\S]*setInterval\(\(\) => \{[\s\S]*refresh\(\)/);
            assert.match(html, /\}, 3000\);/);
            assert.ok((html.match(/if \(result\.isOk\) \{\s*await refresh\(true\);\s*\}/g) || []).length >= 3);
          });

          test('canonical CSS preserves desktop/mobile shell ownership and accepted phone workflows', async () => {
            const css = await source('public/css/military-glass-terminal.css');
            assert.match(css, /#mobile-menu-trigger,[\s\S]*#gate-mobile-nav-sheet,[\s\S]*display:\s*none/);
            assert.doesNotMatch(css, /#week-group-display,\s*#mobile-menu-trigger\s*\{\s*display:\s*inline-flex/);
            assert.match(css, /@media \(max-width:\s*767px\)[\s\S]*#gate-mobile-nav-sheet\.gate-mobile-sheet-open[\s\S]*display:\s*grid/);
            assert.match(css, /@media \(max-width:\s*767px\)[\s\S]*#main-nav-menu,[\s\S]*display:\s*none/);
            assert.match(css, /#page-airport #airport-form input,[\s\S]*font-size:\s*16px/);
            assert.match(css, /#page-airport \.surface:has\(#airport-bus-log-body\)[\s\S]*overflow-x:\s*auto/);
            assert.match(css, /button::before[\s\S]*content:\s*"BACK"/);
          });

          test('background is route-scoped and the global tactical grid is retired', async () => {
            const css = await source('public/css/military-glass-terminal.css');
            assert.match(css, /body::before\s*\{[\s\S]*content:\s*none[\s\S]*display:\s*none/);
            assert.match(css, /body\.gate-app-shell-ready\.gate-watermark-page::after/);
            assert.doesNotMatch(css, /background-size:\s*32px 32px,\s*32px 32px/);
          });

          test('runtime workflows are keyed to the canonical stylesheet', async () => {
            for (const path of [
              '.github/workflows/runtime-record-integrity-tests.yml',
              '.github/workflows/build-2-audit-remediation-gate-1.yml'
            ]) {
              const workflow = await source(path);
              assert.match(workflow, /public\/css\/military-glass-terminal\.css/);
              assert.doesNotMatch(workflow, /public\/css\/(?:gate-utilities-access|gate-premium-metrics|gate-ui-ownership-correction|gate-fullscreen-board-contract)\.css/);
            }
          });
          EOF

      - name: Wire full-system test into both integrity gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/runtime-record-integrity-tests.yml')
          text = p.read_text()
          marker = "      - name: Record display integrity\n        run: node --test tests/runtime/record-display-integrity.test.mjs\n"
          add = marker + "\n      - name: Full system integrity\n        run: node --test tests/runtime/full-system-integrity.test.mjs\n"
          if 'Full system integrity' not in text:
              text = text.replace(marker, add, 1)
          p.write_text(text)
          p = Path('.github/workflows/build-2-audit-remediation-gate-1.yml')
          text = p.read_text()
          marker = "          node --test tests/runtime/active-runtime-budget.test.mjs\n"
          if 'tests/runtime/full-system-integrity.test.mjs' not in text:
              text = text.replace(marker, marker + "          node --test tests/runtime/full-system-integrity.test.mjs\n", 1)
          p.write_text(text)
          PY

      - name: Validate changes before commit
        run: |
          node --test tests/runtime/full-system-integrity.test.mjs
          node --test tests/runtime/active-runtime-budget.test.mjs
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/processing-modal-record-persistence.test.mjs
          node --test tests/runtime/status-board-visual-stability.test.mjs
          if grep -R '!important' -n public/css/military-glass-terminal.css; then
            echo 'Canonical CSS contains prohibited !important declarations.'
            exit 1
          fi

      - name: Commit audited repairs
        run: |
          git config user.name "ORION_Dev"
          git config user.email "austentube@gmail.com"
          git add public/css/military-glass-terminal.css tests/runtime/full-system-integrity.test.mjs .github/workflows/runtime-record-integrity-tests.yml .github/workflows/build-2-audit-remediation-gate-1.yml
          git commit -m "Restore responsive contracts and add full-system integrity audit"
          git push origin HEAD:audit/full-system-integrity-20260914
