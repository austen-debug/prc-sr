name: One-time active bus card shape refinement

on:
  push:
    branches:
      - ui/status-active-bus-card-shape
    paths:
      - '.github/workflows/one-time-active-bus-shape.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/status-active-bus-card-shape
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refine active bus card silhouette
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('public/css/military-glass-terminal.css')
          css = css_path.read_text()
          old = '''  flex: 0 1 260px;\n  min-width: 210px;\n  min-height: 104px;\n  padding: .7rem .78rem;\n  border: 1px solid var(--mg-border-glass);\n  border-radius: var(--mg-radius-md);\n'''
          new = '''  flex: 0 1 300px;\n  min-width: 250px;\n  min-height: 92px;\n  padding: .66rem .82rem;\n  border: 1px solid var(--mg-border-glass);\n  border-radius: var(--mg-radius-sm);\n  -webkit-appearance: none;\n  appearance: none;\n  text-align: left;\n'''
          if css.count(old) != 1:
              raise SystemExit(f'Expected exactly one active bus geometry block, found {css.count(old)}')
          css_path.write_text(css.replace(old, new, 1))

          test_path = Path('tests/runtime/status-board-visual-stability.test.mjs')
          test = test_path.read_text()
          anchor = "test('Metric synchronization is change-only and the Local clock is second-aligned', async () => {"
          addition = r'''test('Active bus cards use a flatter card silhouette instead of native bubble geometry', async () => {
  const css = await source('public/css/military-glass-terminal.css');

  const card = css.match(/#page-board #active-buses \.bus-badge,[\s\S]*?#page-board #active-buses \.gate-component-active-bus-card\s*\{([\s\S]*?)\}/);
  assert.ok(card, 'canonical active bus card style must exist');
  assert.match(card[1], /flex:\s*0 1 300px/);
  assert.match(card[1], /min-width:\s*250px/);
  assert.match(card[1], /min-height:\s*92px/);
  assert.match(card[1], /border-radius:\s*var\(--mg-radius-sm\)/);
  assert.match(card[1], /-webkit-appearance:\s*none/);
  assert.match(card[1], /appearance:\s*none/);
  assert.match(card[1], /text-align:\s*left/);
});

'''
          if anchor not in test:
              raise SystemExit('Missing Status Board test insertion anchor')
          test_path.write_text(test.replace(anchor, addition + anchor, 1))
          PY
      - name: Validate Status Board shape contract
        run: |
          node --test tests/runtime/status-board-visual-stability.test.mjs
          node --test tests/runtime/active-runtime-budget.test.mjs
      - name: Commit shape refinement
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/css/military-glass-terminal.css tests/runtime/status-board-visual-stability.test.mjs
          git commit -m "Refine active bus card shape"
          git push origin HEAD:ui/status-active-bus-card-shape
