name: One-time active bus shape patch

on:
  push:
    branches: [ui/status-active-bus-card-shape]
    paths: ['.github/workflows/one-time-active-bus-shape.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/status-active-bus-card-shape
      - name: Patch canonical CSS
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('public/css/military-glass-terminal.css')
          text = path.read_text()
          changes = [
              ('  flex: 0 1 260px;\n', '  flex: 0 1 300px;\n'),
              ('  min-width: 210px;\n  min-height: 104px;\n  padding: .7rem .78rem;\n', '  min-width: 250px;\n  min-height: 92px;\n  padding: .66rem .82rem;\n'),
              ('  border-radius: var(--mg-radius-md);\n  background: color-mix(in srgb, var(--mg-surface-strong) 88%, transparent);\n', '  border-radius: var(--mg-radius-sm);\n  -webkit-appearance: none;\n  appearance: none;\n  text-align: left;\n  background: color-mix(in srgb, var(--mg-surface-strong) 88%, transparent);\n'),
          ]
          for old, new in changes:
              if text.count(old) != 1:
                  raise SystemExit('Expected one canonical active-bus CSS match')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/css/military-glass-terminal.css
          git commit -m "Refine active bus card shape"
          git push origin HEAD:ui/status-active-bus-card-shape
