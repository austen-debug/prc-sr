name: One-time active bus shape patch

on:
  push:
    branches: [ui/status-active-bus-card-shape]
    paths: ['.github/workflows/one-time-active-bus-shape.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/status-active-bus-card-shape
      - name: Clean canonical CSS
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('public/css/military-glass-terminal.css')
          text = path.read_text()
          old = '''  border-radius: var(--mg-radius-sm);\n  -webkit-appearance: none;\n  appearance: none;\n  text-align: left;\n  background: color-mix(in srgb, var(--mg-surface-strong) 88%, transparent);\n  color: var(--mg-text);\n  text-align: left;\n'''
          new = '''  border-radius: var(--mg-radius-sm);\n  -webkit-appearance: none;\n  appearance: none;\n  background: color-mix(in srgb, var(--mg-surface-strong) 88%, transparent);\n  color: var(--mg-text);\n  text-align: left;\n'''
          if text.count(old) != 1:
              raise SystemExit('Expected one duplicate active-bus text-align sequence')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/css/military-glass-terminal.css
          git commit -m "Clean active bus card CSS"
          git push origin HEAD:ui/status-active-bus-card-shape
