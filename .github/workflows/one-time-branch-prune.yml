name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-branch-prune.yml

permissions:
  contents: write

jobs:
  prune:
    name: Delete obsolete branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import quote

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'gate-branch-prune'
          }

          def call(method, path):
              request = urllib.request.Request(api + path, method=method, headers=headers)
              with urllib.request.urlopen(request) as response:
                  payload = response.read()
                  if not payload:
                      return None
                  return json.loads(payload.decode('utf-8'))

          branches = []
          page = 1
          while True:
              batch = call('GET', f'/branches?per_page=100&page={page}') or []
              if not batch:
                  break
              branches.extend(item['name'] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          targets = sorted(name for name in set(branches) if name != 'main')
          print(f'Found {len(branches)} total branches; pruning {len(targets)} non-main branches.')

          failures = []
          deleted = []
          for name in targets:
              encoded = quote(name, safe='')
              try:
                  call('DELETE', f'/git/refs/heads/{encoded}')
                  deleted.append(name)
                  print(f'DELETED {name}')
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  failures.append((name, error.code, body))
                  print(f'FAILED {name}: HTTP {error.code} {body}')

          print(f'Deleted {len(deleted)} branches.')
          if failures:
              print(f'{len(failures)} branches could not be deleted:')
              for name, code, body in failures:
                  print(f'  {name}: HTTP {code} {body}')
              raise SystemExit(1)
          PY
