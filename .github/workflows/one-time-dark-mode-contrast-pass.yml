name: One-time MGT dark mode contrast pass

on:
  push:
    branches:
      - ui/dark-mode-contrast-pass
    paths:
      - '.github/workflows/one-time-dark-mode-contrast-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-mode-contrast-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply dark mode color-only contrast pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('public/css/military-glass-terminal.css')
          css = path.read_text()

          replacements = {
            '  --mg-bg: #0a0d09;': '  --mg-bg: #121712;',
            '  --mg-bg-elevated: #101510;': '  --mg-bg-elevated: #1b221c;',
            '  --mg-surface: rgba(18, 25, 18, 0.78);': '  --mg-surface: rgba(35, 44, 36, 0.86);',
            '  --mg-surface-strong: rgba(14, 20, 14, 0.94);': '  --mg-surface-strong: rgba(28, 36, 29, 0.96);',
            '  --mg-surface-soft: rgba(39, 51, 38, 0.42);': '  --mg-surface-soft: rgba(72, 88, 73, 0.52);',
            '  --mg-surface-muted: rgba(73, 88, 70, 0.18);': '  --mg-surface-muted: rgba(112, 132, 113, 0.24);',
            '  --mg-text: #edf4eb;': '  --mg-text: #f5f8f4;',
            '  --mg-text-soft: #bec9ba;': '  --mg-text-soft: #d8e0d5;',
            '  --mg-text-muted: #83907f;': '  --mg-text-muted: #a7b2a3;',
            '  --mg-carbon: #121812;': '  --mg-carbon: #161c17;',
            '  --mg-border-glass: rgba(209, 229, 202, 0.17);': '  --mg-border-glass: rgba(216, 232, 211, 0.26);',
            '  --mg-border-soft: rgba(209, 229, 202, 0.10);': '  --mg-border-soft: rgba(216, 232, 211, 0.16);',
            '  --mg-border-strong: rgba(209, 229, 202, 0.30);': '  --mg-border-strong: rgba(216, 232, 211, 0.42);',
            '  --mg-line: rgba(88, 185, 221, 0.12);': '  --mg-line: rgba(88, 185, 221, 0.18);',
            '  --mg-field: rgba(5, 9, 5, 0.54);': '  --mg-field: rgba(14, 19, 15, 0.72);',
            '  --mg-overlay: rgba(2, 5, 2, 0.72);': '  --mg-overlay: rgba(4, 7, 5, 0.68);',
            '  --mg-focus: rgba(88, 185, 221, 0.30);': '  --mg-focus: rgba(88, 185, 221, 0.32);',
            '  --mg-shadow-soft: 0 12px 34px rgba(0, 0, 0, 0.28);': '  --mg-shadow-soft: 0 12px 34px rgba(0, 0, 0, 0.22);',
            '  --mg-shadow-strong: 0 28px 72px rgba(0, 0, 0, 0.48);': '  --mg-shadow-strong: 0 28px 72px rgba(0, 0, 0, 0.40);',
            '  --mg-inset-edge: inset 0 1px 0 rgba(255, 255, 255, 0.075);': '  --mg-inset-edge: inset 0 1px 0 rgba(255, 255, 255, 0.11);'
          }

          for old, new in replacements.items():
            if old not in css:
              raise SystemExit(f'Missing expected dark token: {old}')
            css = css.replace(old, new, 1)

          marker = '''/* --------------------------------------------------------------------------\n   6. DORM BOARDS / STATUS CARDS\n   -------------------------------------------------------------------------- */'''
          if marker not in css:
            raise SystemExit('Missing Status Board section marker')

          contrast = '''body:not(.theme-light) #page-board .metric-card,\nbody:not(.theme-light) #page-board .gate-active-buses-block,\nbody:not(.theme-light) #page-board .gate-dorm-card,\nbody:not(.theme-light) #page-board .dorm-card {\n  background: rgba(40, 50, 42, .93);\n  border-color: rgba(216, 232, 211, .29);\n}\n\nbody:not(.theme-light) #page-board #active-buses .bus-badge,\nbody:not(.theme-light) #page-board #active-buses .prc-bus-card,\nbody:not(.theme-light) #page-board #active-buses .gate-component-active-bus-card {\n  background: rgba(50, 63, 52, .98);\n  border-color: rgba(216, 232, 211, .36);\n  color: var(--mg-text);\n}\n\n'''

          if 'body:not(.theme-light) #page-board .metric-card,' in css:
            raise SystemExit('Dark Status Board contrast block already exists')
          css = css.replace(marker, contrast + marker, 1)
          path.write_text(css)
          PY
      - name: Validate color-only dark mode contracts
        run: |
          node --test tests/runtime/mgt-dark-mode-contrast.test.mjs
          node --test tests/runtime/mgt-color-hierarchy.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/status-board-visual-stability.test.mjs
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
          node --test tests/runtime/login-session-integrity.test.mjs
      - name: Commit dark mode contrast pass
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/css/military-glass-terminal.css
          git commit -m "Improve dark mode contrast and Status Board surfaces"
          git push origin HEAD:ui/dark-mode-contrast-pass
