name: One-time finalize MGT dark mode contrast pass

on:
  push:
    branches:
      - ui/dark-mode-contrast-pass
    paths:
      - '.github/workflows/one-time-dark-mode-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dark-mode-contrast-pass
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Advance cache key governance metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in [
              'functions/_middleware.js',
              'docs/ACTIVE_RUNTIME_STACK.md',
              'docs/build-2/ACTIVE_RUNTIME_BUDGET.json',
              'tests/runtime/operational-ui-audit-remediation.test.mjs',
          ]:
              path = Path(name)
              text = path.read_text()
              old = 'military-glass-terminal-20260915-bluewhite1'
              new = 'military-glass-terminal-20260915-darkcontrast1'
              if old not in text:
                  raise SystemExit(f'Missing cache key in {name}')
              path.write_text(text.replace(old, new))
          PY
      - name: Validate finalized dark mode pass
        run: |
          node --test tests/runtime/mgt-dark-mode-contrast.test.mjs
          node --test tests/runtime/mgt-color-hierarchy.test.mjs
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/login-session-integrity.test.mjs
      - name: Commit finalized delivery contracts
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add functions/_middleware.js docs/ACTIVE_RUNTIME_STACK.md docs/build-2/ACTIVE_RUNTIME_BUDGET.json tests/runtime/operational-ui-audit-remediation.test.mjs
          git commit -m "Finalize dark mode contrast delivery contracts"
          git push origin HEAD:ui/dark-mode-contrast-pass
