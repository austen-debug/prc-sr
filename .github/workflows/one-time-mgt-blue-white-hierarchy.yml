name: One-time MGT blue white hierarchy

on:
  push:
    branches:
      - ui/mgt-blue-white-hierarchy
    paths:
      - '.github/workflows/one-time-mgt-blue-white-hierarchy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mgt-blue-white-hierarchy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Convert remaining committed actions to blue and bust CSS cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text()
          replacements = {
            'onclick="saveAssignedAirman()"\n      class="px-4 py-2 rounded font-bold text-white text-xs"\n      style="background:var(--green);"':
            'onclick="saveAssignedAirman()"\n      class="px-4 py-2 rounded font-bold text-white text-xs"\n      style="background:var(--blue);"',
            '<button onclick="saveLoad()" class="px-4 py-2 rounded font-bold text-white" style="background:var(--green);">SAVE LOAD</button>':
            '<button onclick="saveLoad()" class="px-4 py-2 rounded font-bold text-white" style="background:var(--blue);">SAVE LOAD</button>'
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing expected index action contract: {old[:80]}')
            text = text.replace(old, new, 1)
          index.write_text(text)

          controller = Path('public/js/gate-processing-controller.js')
          text = controller.read_text()
          old = 'style="background:var(--green);">OPEN DORM</button>'
          new = 'style="background:var(--blue);">OPEN DORM</button>'
          if old not in text:
            raise SystemExit('Missing OPEN DORM action contract')
          text = text.replace(old, new, 1)
          controller.write_text(text)

          old_key = 'military-glass-terminal-20260914-mobile-nav1'
          new_key = 'military-glass-terminal-20260915-bluewhite1'
          cache_files = [
            Path('functions/_middleware.js'),
            Path('docs/ACTIVE_RUNTIME_STACK.md'),
            Path('docs/build-2/ACTIVE_RUNTIME_BUDGET.json'),
            Path('tests/runtime/operational-ui-audit-remediation.test.mjs')
          ]
          for path in cache_files:
            body = path.read_text()
            if old_key not in body:
              raise SystemExit(f'Missing cache key in {path}')
            path.write_text(body.replace(old_key, new_key))
          PY
      - name: Validate color hierarchy and runtime regressions
        run: |
          node --test tests/runtime/mgt-color-hierarchy.test.mjs
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/processing-modal-record-persistence.test.mjs
          node --test tests/runtime/login-session-integrity.test.mjs
          node --test tests/runtime/full-system-integrity.test.mjs
      - name: Commit interaction hierarchy and cache key
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/index.html public/js/gate-processing-controller.js functions/_middleware.js docs/ACTIVE_RUNTIME_STACK.md docs/build-2/ACTIVE_RUNTIME_BUDGET.json tests/runtime/operational-ui-audit-remediation.test.mjs
          git commit -m "Finish blue interaction hierarchy and bust CSS cache"
          git push origin HEAD:ui/mgt-blue-white-hierarchy
