name: One-time MGT blue white hierarchy

on:
  push:
    branches:
      - ui/mgt-blue-white-hierarchy
    paths:
      - '.github/workflows/one-time-mgt-blue-white-hierarchy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/mgt-blue-white-hierarchy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply semantic color hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/css/military-glass-terminal.css')
          css = path.read_text()

          replacements = {
            '  --mg-accent: #39ff14;\n  --mg-accent-rgb: 57, 255, 20;\n  --mg-accent-deep: #1ba308;\n  --mg-blue: #58b9dd;':
            '  --mg-accent: #58b9dd;\n  --mg-accent-rgb: 88, 185, 221;\n  --mg-accent-deep: #2d7490;\n  --mg-ok: #3fd08c;\n  --mg-ok-rgb: 63, 208, 140;\n  --mg-ok-deep: #21845c;\n  --mg-blue: #58b9dd;',
            '  --mg-line: rgba(57, 255, 20, 0.13);': '  --mg-line: rgba(88, 185, 221, 0.12);',
            '  --mg-focus: rgba(57, 255, 20, 0.34);': '  --mg-focus: rgba(88, 185, 221, 0.30);',
            '  --green: var(--mg-accent-deep);\n  --green-bright: var(--mg-accent);': '  --green: var(--mg-ok-deep);\n  --green-bright: var(--mg-ok);',
            '  --mg-accent: #4f603d;\n  --mg-accent-rgb: 79, 96, 61;\n  --mg-accent-deep: #465837;\n  --mg-blue: #3f6f80;':
            '  --mg-accent: #2f6f8a;\n  --mg-accent-rgb: 47, 111, 138;\n  --mg-accent-deep: #245b73;\n  --mg-ok: #12805a;\n  --mg-ok-rgb: 18, 128, 90;\n  --mg-ok-deep: #0f6247;\n  --mg-blue: #3f6f80;',
            '  --mg-line: rgba(79, 96, 61, 0.12);': '  --mg-line: rgba(47, 111, 138, 0.12);',
            '  --mg-focus: rgba(79, 96, 61, 0.20);': '  --mg-focus: rgba(47, 111, 138, 0.20);',
            '  background: rgba(79, 96, 61, .12);\n  color: #33402a;': '  background: rgba(47, 111, 138, .12);\n  color: var(--mg-text);',
            '  color: var(--mg-accent);\n  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;': '  color: var(--mg-text);\n  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;',
            '  color: #34452d;\n  text-shadow: none;': '  color: var(--mg-text);\n  text-shadow: none;',
            '  background: var(--mg-accent);\n  box-shadow: 0 0 10px rgba(var(--mg-accent-rgb), .44);': '  background: var(--mg-ok);\n  box-shadow: 0 0 10px rgba(var(--mg-ok-rgb), .38);',
            '  color: var(--mg-accent);\n  font-size: .94rem;': '  color: var(--mg-text);\n  font-size: .94rem;',
            '  color: #34452d;\n}': '  color: var(--mg-text);\n}',
            '  border-color: rgba(var(--mg-accent-rgb), .28);\n  color: var(--mg-accent);': '  border-color: rgba(var(--mg-ok-rgb), .30);\n  color: var(--mg-ok);',
            '  color: #405237;\n}': '  color: var(--mg-ok-deep);\n}',
            '  background: var(--mg-accent-deep);\n  transition: width 180ms ease;': '  background: var(--mg-ok-deep);\n  transition: width 180ms ease;',
            '  background: var(--mg-accent);\n}\n\n.gate-dorm-card.is-over .gate-dorm-progress-fill,': '  background: var(--mg-ok);\n}\n\n.gate-dorm-card.is-over .gate-dorm-progress-fill,'
          }

          for old, new in replacements.items():
            if old not in css:
              raise SystemExit(f'Missing expected CSS contract:\n{old}')
            css = css.replace(old, new, 1)

          # Active route selection should use blue structure with readable white/off-white text.
          old = '''  border-color: color-mix(in srgb, var(--mg-accent) 62%, var(--mg-border-glass));\n  background: color-mix(in srgb, var(--mg-accent) 13%, var(--mg-surface));\n  color: var(--mg-accent);\n}'''
          new = '''  border-color: color-mix(in srgb, var(--mg-accent) 62%, var(--mg-border-glass));\n  background: color-mix(in srgb, var(--mg-accent) 15%, var(--mg-surface));\n  color: var(--mg-text);\n}'''
          if old not in css:
            raise SystemExit('Missing active navigation contract')
          css = css.replace(old, new, 1)

          path.write_text(css)
          PY
      - name: Validate color hierarchy and runtime regressions
        run: |
          node --test tests/runtime/mgt-color-hierarchy.test.mjs
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/processing-modal-record-persistence.test.mjs
          node --test tests/runtime/login-session-integrity.test.mjs
      - name: Commit canonical color hierarchy
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/css/military-glass-terminal.css
          git commit -m "Restore soft blue and white MGT hierarchy"
          git push origin HEAD:ui/mgt-blue-white-hierarchy
