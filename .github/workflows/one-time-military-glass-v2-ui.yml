name: One-time Military Glass v2 UI final repair

on:
  push:
    branches:
      - audit/military-glass-v2-ui
    paths:
      - '.github/workflows/one-time-military-glass-v2-ui.yml'

permissions:
  contents: write

jobs:
  finalize-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/military-glass-v2-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final source and validator repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text()
          replacements = {
              'class="px-3 py-1.5 rounded text-xs font-bold text-white"\n    style="background:var(--red); min-height:30px;"': 'class="gate-danger-action px-3 py-1.5 rounded text-xs font-bold text-white"\n    style="min-height:30px;"',
              'class="px-4 py-1.5 rounded text-xs font-bold text-white"\n    style="background:var(--green); min-height:30px;"': 'class="gate-primary-action px-4 py-1.5 rounded text-xs font-bold text-white"\n    style="min-height:30px;"',
              'class="px-4 py-1.5 rounded text-xs font-bold text-white" style="background:var(--green); min-height:30px;"': 'class="gate-primary-action px-4 py-1.5 rounded text-xs font-bold text-white" style="min-height:30px;"',
              'class="flex-1 py-2 rounded font-bold text-white" style="background:var(--red);"': 'class="gate-danger-action flex-1 py-2 rounded font-bold text-white"'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('Expected modal action markup was not found; refusing partial rewrite.')
              text = text.replace(old, new)
          index.write_text(text)

          test_path = Path('tests/runtime/military-glass-v2-ui-contract.test.mjs')
          test_text = test_path.read_text()
          old = "assert.doesNotMatch(css, /@import\\s+/);"
          new = "assert.doesNotMatch(css, /^[ \\t]*@import\\s+/m);"
          if old not in test_text:
              raise SystemExit('Expected import assertion was not found.')
          test_path.write_text(test_text.replace(old, new))
          PY
      - name: Validate v2 and system contracts
        run: |
          node --test tests/runtime/military-glass-v2-ui-contract.test.mjs
          node --test tests/runtime/login-session-integrity.test.mjs
          node --test tests/runtime/full-system-integrity.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/processing-modal-record-persistence.test.mjs
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
      - name: Commit final v2 repair
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/index.html tests/runtime/military-glass-v2-ui-contract.test.mjs
          git commit -m "Finalize Military Glass v2 semantic UI contracts"
          git push origin HEAD:audit/military-glass-v2-ui