name: One-time Military Glass v2 UI diagnostic

on:
  push:
    branches:
      - audit/military-glass-v2-ui
    paths:
      - '.github/workflows/one-time-military-glass-v2-ui.yml'

permissions:
  contents: write

jobs:
  diagnose-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/military-glass-v2-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture Military Glass v2 contract output
        run: |
          node --test tests/runtime/military-glass-v2-ui-contract.test.mjs > tests/runtime/v2-diagnostic.txt 2>&1 || true
      - name: Commit diagnostic output
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add tests/runtime/v2-diagnostic.txt
          git commit -m "Capture Military Glass v2 contract diagnostics"
          git push origin HEAD:audit/military-glass-v2-ui