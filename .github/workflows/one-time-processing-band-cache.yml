name: One-time Processing designator cache update

on:
  push:
    branches:
      - fix/processing-band-duplicate
    paths:
      - '.github/workflows/one-time-processing-band-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/processing-band-duplicate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Advance dorm flag validation cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'prc-dash-dorm-flag-validation.js?v=record-display-integrity-20260714b'
          new = 'prc-dash-dorm-flag-validation.js?v=processing-band-designator-20260915'
          for name in [
              'functions/_middleware.js',
              'docs/ACTIVE_RUNTIME_STACK.md',
              'docs/build-2/ACTIVE_RUNTIME_BUDGET.json',
              'tests/runtime/record-display-integrity.test.mjs',
          ]:
              path = Path(name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected cache key in {name}')
              path.write_text(text.replace(old, new))
          PY
      - name: Validate Processing designator integrity
        run: |
          node --test tests/runtime/record-display-integrity.test.mjs
          node --test tests/runtime/active-runtime-budget.test.mjs
      - name: Commit cache update
        run: |
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add functions/_middleware.js docs/ACTIVE_RUNTIME_STACK.md docs/build-2/ACTIVE_RUNTIME_BUDGET.json tests/runtime/record-display-integrity.test.mjs
          git commit -m "Advance Processing designator cache key"
          git push origin HEAD:fix/processing-band-duplicate
