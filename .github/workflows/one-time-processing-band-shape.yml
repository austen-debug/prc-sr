name: One-time Processing BAND shape patch

on:
  push:
    branches: [ui/processing-band-marker-shape]
    paths: ['.github/workflows/one-time-processing-band-shape.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/processing-band-marker-shape
      - name: Patch BAND marker geometry and cache key
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          css_path = Path('public/css/military-glass-terminal.css')
          css = css_path.read_text()
          selector = '#page-processing .proc-card.border-band > .text-xl.font-black.font-tabular::before {'
          start = css.index(selector)
          end = css.index('\n}', start) + 2
          block = css[start:end]
          old = 'border-radius: var(--mg-radius-pill);'
          new = 'border-radius: var(--mg-radius-sm);'
          if old not in block:
              raise SystemExit('Processing BAND marker pill radius not found in canonical block')
          block = block.replace(old, new, 1)
          css_path.write_text(css[:start] + block + css[end:])

          old_key = 'military-glass-terminal-20260915-darkcontrast1'
          new_key = 'military-glass-terminal-20260915-bandshape1'
          for name in [
              'functions/_middleware.js',
              'docs/ACTIVE_RUNTIME_STACK.md',
              'docs/build-2/ACTIVE_RUNTIME_BUDGET.json',
              'tests/runtime/operational-ui-audit-remediation.test.mjs',
          ]:
              p = Path(name)
              text = p.read_text()
              if old_key not in text:
                  raise SystemExit(f'Missing cache key in {name}')
              p.write_text(text.replace(old_key, new_key))

          test_path = Path('tests/runtime/operational-ui-audit-remediation.test.mjs')
          test = test_path.read_text()
          anchor = "test('middleware delivers one canonical stylesheet and no retired CSS assets', async () => {"
          addition = """test('Processing BAND designator uses rounded-rectangle geometry', async () => {\n  const css = await source('public/css/military-glass-terminal.css');\n  const marker = css.match(/#page-processing \\.proc-card\\.border-band > \\.text-xl\\.font-black\\.font-tabular::before\\s*\\{([\\s\\S]*?)\\}/);\n  assert.ok(marker, 'Processing BAND marker selector must exist');\n  assert.match(marker[1], /content:\\s*\\\"BAND\\\"/);\n  assert.match(marker[1], /border-radius:\\s*var\\(--mg-radius-sm\\)/);\n  assert.doesNotMatch(marker[1], /border-radius:\\s*var\\(--mg-radius-pill\\)/);\n});\n\n"""
          if anchor not in test:
              raise SystemExit('Missing UI audit insertion anchor')
          test_path.write_text(test.replace(anchor, addition + anchor, 1))
          PY
          node --test tests/runtime/operational-ui-audit-remediation.test.mjs
          node --test tests/runtime/record-display-integrity.test.mjs
          git config user.name ORION_Dev
          git config user.email austentube@gmail.com
          git add public/css/military-glass-terminal.css functions/_middleware.js docs/ACTIVE_RUNTIME_STACK.md docs/build-2/ACTIVE_RUNTIME_BUDGET.json tests/runtime/operational-ui-audit-remediation.test.mjs
          git commit -m "Refine Processing BAND marker shape"
          git push origin HEAD:ui/processing-band-marker-shape
