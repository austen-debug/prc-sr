name: One-time Squadron security integration
on:
  push:
    branches:
      - feat/squadron-sitrep-notices-20260921
    paths:
      - .github/workflows/one-time-squadron-bootstrap.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Retrieve existing reviewed Squadron implementation
        run: git fetch --no-tags origin feat/squadron-security-presentation-20260921:refs/remotes/origin/squadron-source
      - name: Transfer only security and Squadron presentation paths
        run: |
          git checkout refs/remotes/origin/squadron-source -- \
            functions/_middleware.js functions/api/_middleware.js functions/api/login.js \
            functions/api/records-contract.mjs functions/api/session-contract.mjs functions/api/session.js \
            functions/api/squadron-board.js public/js/prc-dash-final-audit.js \
            public/login/index.html public/squadron/index.html public/css/squadron-board.css \
            tests/build-2/server/persistence-audit.test.mjs tests/build-2/server/records-api.test.mjs \
            tests/build-2/server/squadron-security.test.mjs \
            tests/runtime/login-session-integrity.test.mjs
          git diff --cached --check
          git config user.name 'GATE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: selectively integrate Squadron security and existing board [gate-squadron-bootstrap]'
          git push origin HEAD:feat/squadron-sitrep-notices-20260921