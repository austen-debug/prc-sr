name: One-time Squadron regression reconciliation
on:
  push:
    branches:
      - feat/squadron-sitrep-notices-20260921
    paths:
      - .github/workflows/one-time-squadron-regressions.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply targeted fixes
        run: |
          node --check tools/one-time-squadron-regressions.cjs
          node tools/one-time-squadron-regressions.cjs
      - name: Validate affected regression suite
        run: |
          node --check public/js/prc-dash-final-audit.js
          node --test tests/runtime/record-display-integrity.test.mjs
          node --experimental-default-type=module --test tests/build-2/server/squadron-security.test.mjs
      - name: Push isolated source corrections
        run: |
          git config user.name 'GATE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/squadron-board.js public/js/prc-dash-final-audit.js tests/runtime/record-display-integrity.test.mjs
          git diff --cached --check
          git commit -m 'fix: preserve canonical dorm ordering and unchanged Squadron DOM [gate-squadron-card-fix]'
          git push origin HEAD:feat/squadron-sitrep-notices-20260921
# Single-use, removed before merge.
