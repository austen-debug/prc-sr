name: One-time Squadron style reconciliation
on:
  push:
    branches:
      - feat/squadron-sitrep-notices-20260921
    paths:
      - .github/workflows/one-time-squadron-style.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply precisely scoped existing file edits
        run: node tools/one-time-squadron-style.cjs
      - name: Verify syntax and no second stylesheet
        run: |
          node --check public/js/prc-dash-final-audit.js
          node --experimental-default-type=module --check functions/_middleware.js
          ! grep -q '/css/squadron-board.css' functions/_middleware.js
      - name: Commit and push only non-workflow source edits
        run: |
          git config user.name 'GATE CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/css/military-glass-terminal.css functions/_middleware.js
          git diff --cached --check
          git commit -m 'fix: unify Squadron CSS and scripts [gate-squadron-style]'
          git push origin HEAD:feat/squadron-sitrep-notices-20260921
