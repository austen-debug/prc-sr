name: Runtime Record Integrity

on:
  push:
    paths:
      - 'functions/_middleware.js'
      - 'functions/api/**'
      - 'public/index.html'
      - 'public/login/**'
      - 'public/css/military-glass-terminal.css'
      - 'public/js/**'
      - 'tests/runtime/**'
      - '.github/workflows/runtime-record-integrity-tests.yml'
  pull_request:
    paths:
      - 'functions/_middleware.js'
      - 'functions/api/**'
      - 'public/index.html'
      - 'public/login/**'
      - 'public/css/military-glass-terminal.css'
      - 'public/js/**'
      - 'tests/runtime/**'
      - '.github/workflows/runtime-record-integrity-tests.yml'

permissions:
  contents: read

concurrency:
  group: runtime-record-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-integrity:
    name: Runtime record and visual integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse middleware
        run: node --input-type=module --check < functions/_middleware.js

      - name: Login session integrity
        run: node --test tests/runtime/login-session-integrity.test.mjs

      - name: Full system integrity
        run: node --test tests/runtime/full-system-integrity.test.mjs

      - name: Military Glass v2 visual contracts
        run: node --test tests/runtime/military-glass-v2-ui-contract.test.mjs

      - name: Record display integrity
        run: node --test tests/runtime/record-display-integrity.test.mjs

      - name: Dorm timer record lifecycle
        run: node --test tests/runtime/dorm-timer-record-lifecycle.test.mjs

      - name: Processing modal record persistence
        run: node --test tests/runtime/processing-modal-record-persistence.test.mjs

      - name: Fullscreen command-board readability
        run: node --test tests/runtime/fullscreen-command-board-readability.test.mjs

      - name: Operational UI audit remediation
        run: node --test tests/runtime/operational-ui-audit-remediation.test.mjs

      - name: Direct surface observer contract
        run: node --test --test-name-pattern='observer is limited' tests/runtime/status-board-visual-stability.test.mjs

      - name: Incremental column rendering contract
        run: node --test --test-name-pattern='renders dorm states incrementally' tests/runtime/status-board-visual-stability.test.mjs

      - name: Fixed timer geometry contract
        run: node --test --test-name-pattern='timer geometry' tests/runtime/status-board-visual-stability.test.mjs

      - name: Fluid metric typography contract
        run: node --test --test-name-pattern='metrics scale' tests/runtime/status-board-visual-stability.test.mjs

      - name: Change-only metric cadence contract
        run: node --test --test-name-pattern='Metric synchronization' tests/runtime/status-board-visual-stability.test.mjs

      - name: Middleware rewrite declaration contract
        run: node --test --test-name-pattern='contains canonical Status Board rewrite' tests/runtime/status-board-visual-stability.test.mjs

      - name: Served renderer delegation contract
        run: node --test --test-name-pattern='delegates Active Buses and dorm columns' tests/runtime/status-board-visual-stability.test.mjs

      - name: Served metric cadence contract
        run: node --test --test-name-pattern='uses change-only minute metric updates' tests/runtime/status-board-visual-stability.test.mjs

      - name: Active timer ownership contract
        run: node --test --test-name-pattern='Active timer ownership disables' tests/runtime/status-board-visual-stability.test.mjs

      - name: Status Board compositing retirement contract
        run: node --test --test-name-pattern='compositing guard' tests/runtime/status-board-visual-stability.test.mjs