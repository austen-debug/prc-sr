name: Vendor PDF.js Worker Once
on:
  push:
    branches:
      - fix/flight-alert-pdfjs-real-file-extraction
    paths:
      - .github/workflows/vendor-pdfjs-worker.yml
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch licensed upstream worker
        run: |
          mkdir -p public/vendor/pdfjs
          curl --fail --location --retry 3 --silent --show-error             https://raw.githubusercontent.com/mozilla/pdfjs-dist/master/build/pdf.worker.min.js             -o public/vendor/pdfjs/pdf.worker.min.js
          test "$(wc -c < public/vendor/pdfjs/pdf.worker.min.js)" -eq 1074897
          grep -q 'Copyright 2022 Mozilla Foundation' public/vendor/pdfjs/pdf.worker.min.js
      - name: Commit vendored worker to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vendor/pdfjs/pdf.worker.min.js
          git commit -m "vendor(pdfjs): pin compatible local PDF.js worker v3.2.146"
          git push
