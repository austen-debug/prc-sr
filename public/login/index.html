<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#10141a">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · GATE</title>
  <link rel="icon" type="image/png" href="/assets/gate_emblem_blue.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..900&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/military-glass-terminal.css">
</head>
<body class="login-page">
  <div class="login-classification" role="note">UNCLASSIFIED / NO PII / STATUS COUNTS ONLY</div>

  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-brand-stack">
        <div class="login-brand-mark" aria-hidden="true"></div>
        <p class="login-command-kicker">Pfingston Reception Center</p>
        <h1 id="login-title" class="login-title">GATE</h1>
        <p class="login-system-name">Gateway Arrival Tracking Environment</p>
        <div class="login-identity-strip">
          <span>Airport <span aria-hidden="true">→</span> PRC <span aria-hidden="true">→</span> Dorms <span aria-hidden="true">→</span> Archives</span>
          <span>Beta Test v3</span>
        </div>
      </header>

      <form id="login-form" class="login-form" aria-label="GATE sign in">
        <div class="login-field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 enterkeyhint="go" required>
        </div>

        <button id="login-submit" type="submit" class="login-button">Sign In</button>

        <p id="login-message" role="alert"></p>
      </form>

      <p class="login-footer-note">Authorized PRC personnel only · Shared operational access · No PII</p>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const TIMEOUT_MS = 15000;
      const form = document.getElementById('login-form');
      const username = document.getElementById('username');
      const password = document.getElementById('password');
      const submit = document.getElementById('login-submit');
      const msg = document.getElementById('login-message');
      const idleLabel = submit.textContent.trim();
      const RETURN_ROUTES = Object.freeze({
        '/board/': Object.freeze(['instructor', 'airman']),
        '/airport/': Object.freeze(['instructor']),
        '/input/': Object.freeze(['instructor']),
        '/processing/': Object.freeze(['instructor', 'airman']),
        '/archives/': Object.freeze(['instructor']),
        '/squadron-board/': Object.freeze(['instructor']),
        '/squadron/': Object.freeze(['squadron'])
      });

      function destinationForRole(role) {
        const fallback = role === 'squadron' ? '/squadron/' : '/board/';
        const requested = new URLSearchParams(window.location.search).get('returnTo') || '';
        return RETURN_ROUTES[requested]?.includes(role) ? requested : fallback;
      }

      function setBusy(busy) {
        submit.disabled = busy;
        submit.textContent = busy ? 'Verifying…' : idleLabel;
        if (busy) submit.setAttribute('aria-busy', 'true');
        else submit.removeAttribute('aria-busy');
      }

      function show(text) {
        msg.textContent = text;
      }

      async function request(url, options) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
        try {
          return await fetch(url, { credentials: 'same-origin', ...options, signal: controller.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (submit.disabled) return;

        msg.textContent = '';
        setBusy(true);
        let navigating = false;

        try {
          const response = await request('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ username: username.value.trim(), password: password.value })
          });

          const isJson = (response.headers.get('content-type') || '').includes('application/json');
          const result = isJson ? await response.json().catch(() => null) : null;

          if (!result) {
            show('Authentication service returned an invalid response.');
            return;
          }

          if (!response.ok || !result.isOk) {
            show(result.error || 'Login failed.');
            password.value = '';
            password.focus();
            return;
          }

          const sessionResponse = await request('/api/session', {
            method: 'GET',
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
          });
          const session = await sessionResponse.json().catch(() => null);

          if (!sessionResponse.ok || !session?.isOk) {
            show('Login succeeded, but the session could not be verified. Please try again.');
            return;
          }

          navigating = true;
          window.location.replace(destinationForRole(session.role));
        } catch (error) {
          show(error && error.name === 'AbortError'
            ? 'The authentication service timed out. Please retry.'
            : 'Unable to reach the authentication service. Please retry.');
        } finally {
          if (!navigating) setBusy(false);
        }
      });

      window.addEventListener('pageshow', (event) => {
        if (event.persisted) setBusy(false);
      });
    })();
  </script>
</body>
</html>
